[project]
name = "streaming-lakehouse"
version = "0.1.0"
description = "Real-time streaming pipeline: Kafka (Redpanda), Spark, Delta Lake on S3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
    "boto3",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # errors, pyflakes, import sorting, bugbear, pyupgrade

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
