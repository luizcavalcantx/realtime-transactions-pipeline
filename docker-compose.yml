services:
  redpanda:
    image: redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
  console:
    image: redpandadata/console:v3.12.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  spark:
    image: apache/spark:3.5.1-python3
    user: root
    command: sleep infinity # keeps the container alive; we exec jobs into it
    env_file: .env
    environment:
      PYTHONPATH: /opt/app/src
    working_dir: /opt/app
    volumes:
      - ./src:/opt/app/src
      - ./scripts:/opt/app/scripts
      - ivy-cache:/tmp/ivy
    ports:
      - "4040:4040" # Spark UI while a job runs
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  ivy-cache:
